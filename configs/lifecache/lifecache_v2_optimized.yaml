# LifeCache v2 optimized — all fixes enabled
# Pre-RoPE bank + RoPE remap + head-aware routing + real-query compression

lifecache:
  enabled: true
  trace_only: false
  mode: union

  compression: qk_proxy
  compression_topk: 512
  compression_min_tokens: 64

  recall_enabled: true
  recall_top_sets: 4
  recall_top_tokens: 256
  max_frame_distance: null  # No distance filter — RoPE remap handles safety

  anchor_enabled: false
  motion_enabled: false

  region_bias_beta: 0.0
  trace_path: cache_trace.jsonl
  record_latency: true

  # Only enable on last 3 layers (reduce memory pressure)
  enable_last_n_layers: 3

  # v2 RoPE safety
  rope_safe_recall: true
  allow_post_rope_recall: false
  rope_remap_policy: relative_clamp
  max_post_rope_frame_distance: 21
  capture_clean_only: true
  use_real_query_for_compression: true

  # Pyramid head roles for per-layer routing
  head_roles_path: third_party/Pyramid-Forcing/configs/head_configs/best_labels.csv

  bank_max_compressed_sets: 64
  bank_max_compressed_tokens: 65536
