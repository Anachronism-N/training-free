# LifeCache v3.2 — Gated Parallel Oracle
# Key improvements over v3.1:
# 1. Gated parallel attention: separate recent/memory branches, no softmax competition
# 2. Per-head gate: WAVE heads blocked from memory, identity/layout heads get memory
# 3. RMS matching: scale memory output to match recent output
# 4. Memory gate: controlled fusion strength (0.10 = 10% memory influence)

lifecache:
  enabled: true
  trace_only: false
  mode: union

  compression: none
  recall_enabled: true
  recall_top_sets: 1
  recall_top_tokens: 1560
  max_frame_distance: null

  anchor_enabled: false
  motion_enabled: false

  region_bias_beta: 0.0
  trace_path: cache_trace.jsonl
  record_latency: true

  enable_last_n_layers: 1

  rope_safe_recall: true
  allow_post_rope_recall: false
  rope_remap_policy: relative_clamp
  max_post_rope_frame_distance: 21
  capture_clean_only: false
  use_real_query_for_compression: false

  strict_correctness: false

  oracle_mode: full_frame
  oracle_layer: 29
  oracle_num_frames: 1
  oracle_capture_frames: [0]
  oracle_recall_frames: [30, 60, 90]
  oracle_append_mode: true
  oracle_mask_wave_heads: false  # Disabled: handled by head mask in gated attention

  # v3.2: Gated parallel attention
  use_gated_attention: true
  memory_gate: 0.10
  use_rms_matching: true

  head_roles_path: third_party/Pyramid-Forcing/configs/head_configs/best_labels.csv

  bank_max_compressed_sets: 4
  bank_max_compressed_tokens: 8192
