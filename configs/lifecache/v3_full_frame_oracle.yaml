# LifeCache v3 — Full-Frame Oracle (Stage 2)
# Deterministic recall of a complete historical frame.
# No compression, no retrieval, no sparse top-k.
# Tests: does clean full-frame K/V help scene revisit?

lifecache:
  enabled: true
  trace_only: false
  mode: union

  compression: none
  recall_enabled: true
  recall_top_sets: 1
  recall_top_tokens: 1560  # One full frame (52x30 = 1560 tokens)
  max_frame_distance: null

  anchor_enabled: false
  motion_enabled: false

  region_bias_beta: 0.0
  trace_path: cache_trace.jsonl
  record_latency: true

  enable_last_n_layers: 1

  rope_safe_recall: true
  allow_post_rope_recall: false
  rope_remap_policy: relative_clamp
  max_post_rope_frame_distance: 21
  capture_clean_only: false
  use_real_query_for_compression: false

  # Oracle mode: bypass all compression/retrieval
  # Captures full-frame K/V from clean-context forward and injects
  # deterministically during scene revisit frames.
  oracle_mode: full_frame
  oracle_layer: 29
  oracle_num_frames: 1
  # Frame 0 = A1 scene (capture), Frame 6 = A2 revisit (recall)
  # 120f ABA schedule: frames 0-3=A1, 4-5=B, 6-7=A2
  # Using 21 frames per block, 4 blocks total:
  #   block0: frames 0-20 (A1, capture)
  #   block1: frames 21-41 (A1)
  #   block2: frames 42-62 (A1/B)
  #   block3: frames 63-83 (B/A2)
  #   block4: frames 84-104 (A2)
  #   block5: frames 105-119 (A2)
  # Capture at frame 0, recall starting at frame 63
  oracle_capture_frames: [0]
  oracle_recall_frames: [63, 84, 105]
  oracle_append_mode: true

  head_roles_path: third_party/Pyramid-Forcing/configs/head_configs/best_labels.csv

  bank_max_compressed_sets: 4
  bank_max_compressed_tokens: 8192
