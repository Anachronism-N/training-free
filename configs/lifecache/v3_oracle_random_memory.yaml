# LifeCache v3 — Full-Frame Oracle Control: Random Memory
# Injects random tokens (same shape as oracle frame) instead of real K/V.
# Controls for the effect of simply increasing active token count.

lifecache:
  enabled: true
  trace_only: false
  mode: union

  compression: none
  recall_enabled: true
  recall_top_sets: 1
  recall_top_tokens: 1560
  max_frame_distance: null

  anchor_enabled: false
  motion_enabled: false

  region_bias_beta: 0.0
  trace_path: cache_trace.jsonl
  record_latency: true

  enable_last_n_layers: 1

  rope_safe_recall: true
  allow_post_rope_recall: false
  rope_remap_policy: relative_clamp
  max_post_rope_frame_distance: 21
  capture_clean_only: false
  use_real_query_for_compression: false

  oracle_mode: full_frame
  oracle_layer: 29
  oracle_num_frames: 1
  oracle_capture_frames: [0]
  oracle_recall_frames: [63, 84, 105]
  oracle_append_mode: true
  # NOTE: The "random" aspect is NOT a config flag — it's handled by
  # the existing random_recall code path in runtime.py. To run random
  # control, use this config with LIFECACHE_RANDOM_RECALL=1 env var
  # or modify the config to set random_recall: true.

  head_roles_path: third_party/Pyramid-Forcing/configs/head_configs/best_labels.csv

  bank_max_compressed_sets: 4
  bank_max_compressed_tokens: 8192
