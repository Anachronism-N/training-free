# LifeCache v3 — Native Control (E0/E1 baseline)
# Must produce output identical to native Self-Forcing.
# Used for equivalence verification.

lifecache:
  enabled: true
  trace_only: true
  mode: union

  compression: none
  recall_enabled: false
  anchor_enabled: false
  motion_enabled: false

  region_bias_beta: 0.0
  trace_path: cache_trace.jsonl
  record_latency: true

  enable_last_n_layers: 1
  capture_clean_only: false

  bank_max_compressed_sets: 8
  bank_max_compressed_tokens: 4096
