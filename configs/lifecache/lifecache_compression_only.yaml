# LifeCache compression-only config — Phase 2
# Evicted tokens are compressed via Q-K proxy and stored in bank.
# No recall, no output change — only bank grows.

lifecache:
  enabled: true
  trace_only: true
  mode: union

  compression: qk_proxy
  compression_topk: 512
  compression_min_tokens: 64

  recall_enabled: false
  anchor_enabled: false
  motion_enabled: false

  region_bias_beta: 0.0
  trace_path: cache_trace.jsonl
  record_latency: true

  bank_max_compressed_sets: 64
  bank_max_compressed_tokens: 65536
