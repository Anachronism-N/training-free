# LifeCache trace-only config — Phase 0/1
# K/V shapes and eviction events are traced to JSONL.
# No compression, no recall, no output change.

lifecache:
  enabled: true
  trace_only: true
  mode: union

  compression: none
  recall_enabled: false
  anchor_enabled: false
  motion_enabled: false

  region_bias_beta: 0.0
  trace_path: cache_trace.jsonl
  record_latency: true
