# LifeCache union recall config — Phase 3
# Compression + recall on last 6 layers in union mode.
# This is the first config that CHANGES model output.

lifecache:
  enabled: true
  trace_only: false
  mode: union

  compression: qk_proxy
  compression_topk: 512
  compression_min_tokens: 64

  recall_enabled: true
  recall_top_sets: 4
  recall_top_tokens: 256
  max_frame_distance: null

  anchor_enabled: true
  dynamic_anchor_enabled: true
  anchor_budget: 256
  anchor_update_interval: 4

  motion_enabled: false

  region_bias_beta: 0.0
  trace_path: cache_trace.jsonl
  record_latency: true

  # Only enable on last 6 layers
  enable_last_n_layers: 6

  bank_max_compressed_sets: 64
  bank_max_compressed_tokens: 65536
  bank_max_anchor_sets: 32
  bank_max_anchor_tokens: 32768
