# Official Causal-Forcing chunk-wise 4-step schedule, executed through the
# shared patched Wan inference path so LifeCache code is identical across
# Self-Forcing and Causal-Forcing. The 21-frame rolling window is explicit for
# training-free long-horizon extrapolation.

generator_ckpt: checkpoints/chunkwise/causal_forcing.pt
denoising_step_list:
  - 1000
  - 750
  - 500
  - 250
warp_denoising_step: true
timestep_shift: 5.0
guidance_scale: 3.0
num_frame_per_block: 3
model_kwargs:
  local_attn_size: 21
  timestep_shift: 5.0
